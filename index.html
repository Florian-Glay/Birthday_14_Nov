<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f20f73" />
    <meta
      name="description"
      content="Une collection de souvenirs pour célébrer les 21 ans de Lou, le 14 novembre 2026."
    />
    <title>Les 21 ans de Lou ✦ 14.11.2026</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="ambient-grain" aria-hidden="true"></div>
    <div class="glow glow-one" aria-hidden="true"></div>
    <div class="glow glow-two" aria-hidden="true"></div>

    <main class="birthday-stage">
      <div class="orbit-scene" id="orbitScene" aria-hidden="true">
        <div class="orbit-track" id="orbitTrack"></div>
      </div>

      <section class="love-letter" aria-labelledby="birthday-title">
        <div class="vinyl" aria-hidden="true">
          <span class="vinyl-ring vinyl-ring-one"></span>
          <span class="vinyl-ring vinyl-ring-two"></span>
          <span class="vinyl-label"><b>21</b><small>LOU</small></span>
        </div>

        <h1 id="birthday-title">
          Joyeux anniversaire
          <span>mon amoure</span>
        </h1>

        <div class="milestone" aria-label="21 ans">
          <span>21 ans</span>
        </div>

        <button class="celebrate-button" id="celebrateButton" type="button">
          <i aria-hidden="true">♥</i>
        </button>
      </section>

      <div class="confetti-layer" id="confettiLayer" aria-hidden="true"></div>
    </main>

    <noscript>
      <p class="noscript-message">Active JavaScript pour faire tourner nos souvenirs.</p>
    </noscript>
    <script src="media-manifest.js"></script>
    <script src="app.js"></script>
  </body>
</html>
